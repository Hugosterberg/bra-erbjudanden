name: Monetization System Tests

on:
  push:
    branches: [main, feature/affiliate-import]
    paths:
      - 'src/features/monetization/**'
      - 'src/features/ad-network/**'
      - 'src/shared/types/database.ts'
      - 'src/app/admin/annonser/**'
      - 'src/app/admin/intakter/**'
      - 'src/app/admin/intakter-pro/**'
      - 'src/app/api/advertisers/**'
      - 'src/app/api/cron/ad-network-maintenance/**'
      - 'supabase/migrations/*monetization*'
      - 'supabase/migrations/*ad*'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - '.github/workflows/monetization.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/features/monetization/**'
      - 'src/features/ad-network/**'
      - 'src/shared/types/database.ts'
      - 'src/app/admin/annonser/**'
      - 'src/app/admin/intakter/**'
      - 'src/app/admin/intakter-pro/**'
      - 'src/app/api/advertisers/**'
      - 'src/app/api/cron/ad-network-maintenance/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - 'scripts/test-monetization.mjs'
      - 'scripts/test-ad-network.mjs'
      - 'scripts/run-tests.mjs'
      - '.github/workflows/monetization.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    name: TypeScript Type Check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    name: Linting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint -- src/features/monetization src/features/ad-network

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --testPathPattern='(monetization|ad-network)' --coverage
      - uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: monetization

  security:
    runs-on: ubuntu-latest
    name: Security Audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=moderate

  build:
    runs-on: ubuntu-latest
    name: Build Check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
